<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Financial Tracker — DeltaX Games</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
/* Düzen: tek sütun, üstte sekmeler; gelir mavi, gider turuncu, toplamlar (kasa, net) mürekkep rengi.
   Site gibi koyu temadır; açık tema tercih eden tarayıcıda açık renkler gelir. Dış siteden font/script yüklenmez. */
:root{
  --page:#0b0e14; --surface:#11151d; --ink:#e9edf5; --ink2:#9aa5ba; --muted:#8a94a8;
  --line:#232b3b; --axis:#3a4459; --wash:rgba(255,255,255,.05);
  --gelir:#3d85ff; --gider:#f28231;
  --pos:#4cc46a; --neg:#ff7b7b; --focus:#3d85ff;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --page:#f6f7fa; --surface:#ffffff; --ink:#0b0e14; --ink2:#4f586a; --muted:#6b7589;
    --line:#e1e5ee; --axis:#c3c9d6; --wash:rgba(11,14,20,.05);
    --gelir:#0054fe; --gider:#d9661a;
    --pos:#0a7a2a; --neg:#b3261e; --focus:#0054fe;
    color-scheme:light;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:400 14px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) 72px}

.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 20px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.brand{display:block;line-height:0}
.brand img{height:26px;width:auto;display:block}
.brand .lg-light{display:none}
@media (prefers-color-scheme: light){.brand .lg-dark{display:none}.brand .lg-light{display:block}}
.top h1{font-size:15px;font-weight:600;color:var(--ink2);letter-spacing:-.01em}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{appearance:none;background:none;border:0;padding:10px 12px;color:var(--ink2);cursor:pointer;font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.tab:hover{background:var(--wash)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.who{margin-left:auto;color:var(--ink2);font-size:13px;overflow-wrap:anywhere}
.logout{color:var(--ink2);font-size:13px;text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:6px;white-space:nowrap}
.logout:hover{color:var(--ink);border-color:var(--axis)}

.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.seg button:hover{background:var(--wash)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:12px 20px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:20px 0 4px}

.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px 56px;align-items:end;padding:20px 0 24px}
.hero-val{font-size:clamp(40px,8vw,60px);font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:6px 0 6px}
.hero-sub{color:var(--ink2);max-width:46ch}
.acct{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.acct small{color:var(--ink2)}
.acct .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.acct .v small{display:block;font-weight:400}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 0 16px;border-top:1px solid var(--line)}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:500}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink2)}
.up{color:var(--pos)} .down{color:var(--neg)}

.stack{display:grid;gap:16px;margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 16px;flex-wrap:wrap;margin-bottom:10px}
.card h2{font-size:15px;font-weight:600}
.card .sub{color:var(--ink2);font-size:13px;margin-top:2px}
.legend{display:flex;gap:4px 16px;flex-wrap:wrap;color:var(--ink2);font-size:13px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;border-radius:1px;vertical-align:3px}
.link{appearance:none;border:0;background:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0}
.link:hover{color:var(--ink)}

.chart{width:100%;min-height:200px}
.chart svg{display:block;max-width:100%}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--axis);stroke-width:1}
.chart .band{fill:transparent}
.chart .g:hover .band,.chart .g:focus .band{fill:var(--wash)}
.chart .g{outline:none}
.chart .g:focus-visible .band{stroke:var(--focus);stroke-width:2}
.chart .xh{stroke:var(--axis);stroke-width:1;opacity:0}
.chart .g:hover .xh,.chart .g:focus .xh{opacity:1}
.chart .endlbl{fill:var(--ink);font-weight:600;font-size:12px}
.chart .m-in{fill:var(--gelir)} .chart .m-out{fill:var(--gider)}
.chart .g:hover .m-in,.chart .g:hover .m-out{filter:brightness(1.12)}

.cats{display:grid;gap:2px}
.cat{display:grid;grid-template-columns:minmax(90px,36%) minmax(0,1fr);gap:10px;align-items:center;padding:6px 4px;border-radius:6px}
.cat:hover,.cat:focus{background:var(--wash);outline:none}
.cat .cn{overflow-wrap:anywhere;font-size:13px}
.cat .cb{display:flex;align-items:center;gap:8px;min-width:0}
.cat .cb i{display:block;height:14px;min-width:2px;border-radius:0 4px 4px 0;background:var(--gider);flex:none}
.cats.in .cb i{background:var(--gelir)}
.cat .cb span{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.li{display:flex;justify-content:space-between;gap:12px;padding:10px 4px;border-top:1px solid var(--line);align-items:center;cursor:pointer;border-radius:4px}
.li:first-child{border-top:0}
.li:hover,.li:focus{background:var(--wash);outline:none}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .d{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.li .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.li .a small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill svg{width:12px;height:12px;flex:none}
.pill.late{color:var(--neg);border-color:currentColor}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
caption{text-align:left;color:var(--ink2);font-size:12px;padding-bottom:6px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--axis);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td,tr.row:focus td{background:var(--wash)}
tr.row:focus{outline:none}
tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--axis)}
.sub-t{color:var(--ink2);font-size:12px;overflow-wrap:anywhere}
.nw{white-space:nowrap}
.field>label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:400}
input[type="checkbox"]{width:auto}
input[type="file"]{padding:6px}
@media (max-width:720px){.hide-sm{display:none}}

.btn{appearance:none;border:1px solid var(--axis);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{background:var(--wash)}
.btn.pri{background:var(--ink);color:var(--page);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}

.field{display:grid;gap:4px;min-width:0}
.field>label{font-size:12px;color:var(--ink2);font-weight:500}
.field small{color:var(--ink2);font-size:12px}
input,select,textarea{background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.bar{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:end;margin:16px 0}
.bar .field{flex:1 1 150px}
.bar .field.sm{flex:0 1 150px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(580px,100%);padding:20px;margin-top:4vh}
.modal h2{font-size:17px;font-weight:600;margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.mfoot .sp{margin-right:auto}
.err{color:var(--neg);font-size:13px;margin-top:10px}
.preview{color:var(--ink2);font-size:13px}

.banner{border:1px solid var(--axis);background:var(--wash);border-radius:8px;padding:10px 12px;margin-top:14px;display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--ink2);border:1px dashed var(--axis);border-radius:10px;margin-top:20px}
.empty h2{color:var(--ink);font-size:17px;margin-bottom:6px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.note{color:var(--ink2);font-size:13px;max-width:70ch}
.sec{margin-top:28px}
.sec>h2{font-size:15px;font-weight:600;margin-bottom:4px}
.rowflex{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}

#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:12px;max-width:260px;opacity:0;left:0;top:0}
#tip.on{opacity:1}
#tip .t{color:var(--ink2);margin-bottom:4px}
#tip .r{display:flex;align-items:center;gap:6px;padding:1px 0}
#tip .r b{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
#tip .k{display:inline-block;width:12px;height:2px;border-radius:1px;flex:none}
#tip .l{color:var(--ink2)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--page);padding:9px 16px;border-radius:8px;font-weight:500;z-index:70;opacity:0;pointer-events:none;transition:opacity .15s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
.loading{padding:60px 0;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="DeltaX Games"><img class="lg-dark" src="/assets/logo/logo-wordmark-ondark.png" alt="" width="143" height="40"><img class="lg-light" src="/assets/logo/logo-wordmark-onlight.png" alt="" width="143" height="40"></a>
    <h1>Financial Tracker</h1>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Bölümler"></nav>
    <div class="who" id="who"></div>
    <a class="logout" href="/cdn-cgi/access/logout">Çıkış</a>
  </header>
  <main id="app"><div class="loading">Veriler yükleniyor…</div></main>
</div>
<div id="modal" class="ov" hidden></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- yardımcılar ---------- */
const MON=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const MONF=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const SYM={TRY:'₺',USD:'$'};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mkey=d=>d.slice(0,7);
const addM=(k,n)=>{const p=k.split('-').map(Number);const i=p[0]*12+(p[1]-1)+n;return Math.floor(i/12)+'-'+pad(i%12+1)};
const monthsBetween=(a,b)=>{const r=[];for(let k=a;k<=b&&r.length<400;k=addM(k,1))r.push(k);return r};
const mlabel=k=>MON[+k.slice(5)-1];
const mfull=k=>MONF[+k.slice(5)-1]+' '+k.slice(0,4);
const dfmt=d=>{if(!d)return '';const p=d.split('-');return (+p[2])+' '+MON[+p[1]-1]+' '+p[0]};
const endOfMonth=k=>{const p=k.split('-').map(Number);return k+'-'+pad(new Date(p[0],p[1],0).getDate())};
const addDays=(d,n)=>{const p=d.split('-').map(Number);const t=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())};
const NF0=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const NF2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
function money(n,c,d){n=+n||0;const q=d?100:1;const r=Math.round(Math.abs(n)*q)/q;return (n<0&&r>0?'−':'')+SYM[c]+(d?NF2:NF0).format(r)}
function signed(n,c,d){n=+n||0;const q=d?100:1;const r=Math.round(Math.abs(n)*q)/q;return (r===0?'':n<0?'−':'+')+SYM[c]+(d?NF2:NF0).format(r)}
const trim1=x=>(Math.round(x*10)/10).toString().replace('.',',');
function compact(n){const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+trim1(a/1e6)+' Mn';if(a>=1e3)return s+trim1(a/1e3)+' B';return s+Math.round(a)}
const num=v=>{if(typeof v==='number')return v;let s=String(v||'').trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');const x=parseFloat(s);return isFinite(x)?x:NaN};
const r2=x=>Math.round(x*100)/100;

const DEFAULT_CATS=[
  ['c-steam','Steam','income',0],['c-yayinci','Yayıncı ve avans','income',0],['c-hibe','Hibe ve destek','income',0],['c-hizmet','Hizmet geliri','income',20],['c-gelir-diger','Diğer gelir','income',20],
  ['c-maas','Maaş ve SGK','expense',0],['c-freelance','Freelancer ve dış hizmet','expense',20],['c-yazilim','Yazılım ve abonelikler','expense',20],['c-pazarlama','Pazarlama ve reklam','expense',20],['c-ofis','Ofis ve kira','expense',20],['c-ekipman','Ekipman','expense',20],['c-muhasebe','Muhasebe ve hukuk','expense',20],['c-vergi','Vergi ve harçlar','expense',0],['c-banka','Banka ve komisyon','expense',0],['c-seyahat','Seyahat ve etkinlik','expense',10],['c-gider-diger','Diğer gider','expense',20]
];
const VAT_OPTS=[0,1,10,20];
const TABS=[['ozet','Özet'],['islemler','İşlemler'],['ortaklar','Ortaklar'],['kdv','KDV'],['ayarlar','Ayarlar']];
const RANGES=[['3m','3 ay'],['6m','6 ay'],['12m','12 ay'],['ytd','Bu yıl'],['all','Tümü']];
const COLLECTIONS=['transactions','accounts','categories','rates','settings'];

/* ---------- durum ---------- */
const S={tab:'ozet',range:'6m',ccy:'TRY',basis:'buy',
  tx:[],accounts:[],cats:[],ratesDocs:[],rates:[],settings:{},settingsV:null,catMap:new Map(),acctMap:new Map(),
  ready:false,demo:false,dbState:'init',canWrite:true,canAdmin:false,uid:null,meName:'',
  f:{q:'',type:'',cat:'',acct:'',status:'',month:''},txLimit:100,catView:'expense',tbl:{flow:false,bal:false},m:null};
let chartW=0;

const PK='deltax-finance:prefs';
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem(PK)||'{}');if(RANGES.some(r=>r[0]===p.range))S.range=p.range;if(p.ccy==='TRY'||p.ccy==='USD')S.ccy=p.ccy}catch(e){}}
function savePrefs(){try{localStorage.setItem(PK,JSON.stringify({range:S.range,ccy:S.ccy}))}catch(e){}}

/* ---------- API (Cloudflare Worker, /int/api) ---------- */
const API='/int/api';
async function call(method,path,body){
  let r;
  try{
    r=await fetch(API+path,{method:method,headers:body!==undefined?{'content-type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'});
  }catch(x){const e=new Error('network');e.code='network';throw e}
  let j=null;const ct=r.headers.get('content-type')||'';
  if(ct.indexOf('application/json')>=0){try{j=await r.json()}catch(x){}}
  if(r.ok&&j)return j;
  const e=new Error((j&&j.error)||('HTTP '+r.status));
  e.code=(j&&j.code)||(r.status===401?'auth':r.status===403?'forbidden':r.status===404?'notfound':r.status===409?'conflict':'http');
  e.status=r.status;throw e;
}
const api={
  me:()=>call('GET','/me'),
  list:c=>call('GET','/'+c),
  set:(c,id,data,ifv)=>call('PUT','/'+c+'/'+encodeURIComponent(id),ifv==null?{data:data}:{data:data,if_version:ifv}),
  add:(c,data)=>call('POST','/'+c,{data:data}),
  del:(c,id)=>call('DELETE','/'+c+'/'+encodeURIComponent(id)),
  importDocs:docs=>call('POST','/_import',{docs:docs}),
  refreshRates:()=>call('POST','/_rates/refresh')
};
const COLKEY={transactions:'tx',accounts:'accounts',categories:'cats',rates:'ratesDocs'};
function applyDocs(col,docs){
  if(col==='settings'){const main=docs.find(d=>d.id==='main');S.settings=main?main.data:{};S.settingsV=main?main.version:null;return}
  S[COLKEY[col]]=docs.map(d=>{const o=Object.assign({id:d.id,_v:d.version},d.data);return col==='transactions'?norm(o):o});
}
async function reload(col){
  if(S.demo)return;
  const r=await api.list(col);applyDocs(col,r.docs);derive();schedule();
}
let lastSync=0;
async function reloadAll(silent){
  if(S.demo)return;
  try{
    const rs=await Promise.all(COLLECTIONS.map(c=>api.list(c)));
    COLLECTIONS.forEach((c,i)=>applyDocs(c,rs[i].docs));
    S.dbState='ok';lastSync=Date.now();
  }catch(e){
    if(silent)return;
    S.dbState=(e.code==='auth'||e.code==='forbidden')?'auth':'none';
  }
  S.ready=true;derive();schedule();
}
function syncIfStale(){

/* ---------- veri katmanı ---------- */
const norm=t=>Object.assign({},t,{cd:t.cashDate||t.date,aTRY:+t.amountTRY||0,aUSD:+t.amountUSD||0});
function derive(){
  S.catMap=new Map(S.cats.map(c=>[c.id,c]));
  S.acctMap=new Map(S.accounts.map(a=>[a.id,a]));
  S.cats.sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name,'tr'));
  S.accounts.sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name,'tr'));
  const list=[];
  for(const d of S.ratesDocs){for(const k in d){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(d[k])&&d[k][0]>0)list.push([k,+d[k][0],+(d[k][1]||d[k][0])])}}
  list.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  S.rates=list;
  S.basis=S.settings.rateBasis==='sell'?'sell':'buy';
}
function rateAt(date){
  const L=S.rates;if(!L.length)return null;
  let lo=0,hi=L.length-1,ans=-1;
  while(lo<=hi){const mid=(lo+hi)>>1;if(L[mid][0]<=date){ans=mid;lo=mid+1}else hi=mid-1}
  const r=L[ans<0?0:ans];
  return {date:r[0],v:S.basis==='sell'?r[2]:r[1],exact:r[0]===date};
}
const amt=t=>S.ccy==='TRY'?t.aTRY:t.aUSD;
const isFlow=t=>t.type==='income'||t.type==='expense';
function effect(t,a){
  if(t.type==='transfer'){
    if(t.accountId===a.id)return -(+t.amount||0);
    if(t.toAccountId===a.id)return +(t.toAmount||0);
    return 0;
  }
  if(t.accountId!==a.id)return 0;
  const v=a.currency==='TRY'?t.aTRY:t.aUSD;
  return t.type==='income'?v:-v;
}
function acctBal(a,upto){
  let b=+a.opening||0;const od=a.openingDate||'';
  for(const t of S.tx){
    if(t.status!=='done')continue;
    if(od&&t.cd<od)continue;
    if(upto&&t.cd>upto)continue;
    b+=effect(t,a);
  }
  return b;
}
function conv(v,from,to,date){
  if(from===to)return v;
  const r=rateAt(date||todayStr());if(!r)return 0;
  return from==='USD'?v*r.v:v/r.v;
}
function bounds(){
  const cur=mkey(todayStr());let to=cur;
  const done=S.tx.filter(t=>t.status==='done'&&isFlow(t));
  const maxD=done.reduce((m,t)=>t.cd>m?t.cd:m,'');
  if(maxD&&mkey(maxD)>to)to=mkey(maxD);
  let from;const r=S.range;
  if(r==='3m')from=addM(to,-2);else if(r==='6m')from=addM(to,-5);else if(r==='12m')from=addM(to,-11);
  else if(r==='ytd')from=to.slice(0,4)+'-01';
  else{const minD=done.reduce((m,t)=>!m||t.cd<m?t.cd:m,'');from=minD?mkey(minD):to;if(from<addM(to,-59))from=addM(to,-59)}
  return {from,to,months:monthsBetween(from,to),cur};
}
function flows(months){
  const m=new Map(months.map(k=>[k,{k,in:0,out:0}]));
  for(const t of S.tx){
    if(t.status!=='done'||!isFlow(t))continue;
    const r=m.get(mkey(t.cd));if(!r)continue;
    if(t.type==='income')r.in+=amt(t);else r.out+=amt(t);
  }
  return Array.from(m.values()).map(r=>Object.assign(r,{net:r.in-r.out}));
}
function kasaAt(date){
  let s=0;for(const a of S.accounts){if(a.partner)continue;s+=conv(acctBal(a,date||''),a.currency,S.ccy,date||todayStr())}return s;
}
function balSeries(months){
  const today=todayStr();
  return months.map(k=>{const d=k===mkey(today)?today:endOfMonth(k);return {k,v:kasaAt(d)}});
}
function runway(){
  const cur=mkey(todayStr());const ms=[addM(cur,-3),addM(cur,-2),addM(cur,-1)];
  const F=flows(ms);const has=S.tx.some(t=>t.status==='done'&&isFlow(t)&&ms.includes(mkey(t.cd)));
  if(!has)return {state:'none'};
  const avg=F.reduce((s,r)=>s+r.net,0)/3;
  const kasa=kasaAt('');
  if(avg>=0)return {state:'pos',avg};
  if(kasa<=0)return {state:'nokasa',avg};
  return {state:'burn',avg,months:kasa/-avg};
}
const planned=()=>S.tx.filter(t=>t.status==='planned').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function vatOf(t){const r=+t.vatRate||0;return r?amt(t)*r/(100+r):0}
function rateStale(){
  if(S.demo||!S.rates.length)return null;
  const last=S.rates[S.rates.length-1][0];
  return last<addDays(todayStr(),-5)?last:null;
}

/* ortaklar sekmesi */
function partnerStats(){
  const P=S.accounts.filter(a=>a.partner);if(!P.length)return null;
  const now=todayStr();
  const rows=P.map(a=>({a:a,ratio:+a.share>0?+a.share:1,paid:0,sent:0,recv:0,share:0,net:0}));
  const by=new Map(rows.map(r=>[r.a.id,r]));
  for(const t of S.tx){
    if(t.status!=='done')continue;
    if(t.type==='transfer'){
      const f=by.get(t.accountId),to=by.get(t.toAccountId);
      if(f)f.sent+=conv(+t.amount||0,f.a.currency,'TRY',now);
      if(to)to.recv+=conv(+t.toAmount||0,to.a.currency,'TRY',now);
    }else{
      const f=by.get(t.accountId);if(f)f.paid+=t.type==='expense'?t.aTRY:-t.aTRY;
    }
  }
  const total=rows.reduce((s,r)=>s+r.paid,0),rs=rows.reduce((s,r)=>s+r.ratio,0);
  rows.forEach(r=>{r.share=total*r.ratio/rs;r.net=r.paid-r.share+r.sent-r.recv});
  return {rows:rows,total:total,rs:rs};
}
function settleCalc(rows){
  const cr=rows.filter(r=>r.net>0.5).map(r=>({a:r.a,v:r.net})).sort((x,y)=>y.v-x.v);
  const dr=rows.filter(r=>r.net<-0.5).map(r=>({a:r.a,v:-r.net})).sort((x,y)=>y.v-x.v);
  const out=[];let i=0,j=0;
  while(i<dr.length&&j<cr.length){
    const x=Math.min(dr[i].v,cr[j].v);out.push({from:dr[i].a,to:cr[j].a,v:r2(x)});
    dr[i].v-=x;cr[j].v-=x;if(dr[i].v<0.5)i++;if(cr[j].v<0.5)j++;
  }
  return out;
}

   +'<p class="note" style="margin-top:10px">Net durum artıysa diğer ortaklar ona borçlu, eksiyse o diğerlerine borçlu. Pay oranını Ayarlar sekmesinde ortağın hesabından değiştirebilirsin.</p>';
  const L=settleCalc(R);
  h+='<section class="sec"><h2 style="font-size:17px">Kim kime ne kadar ödemeli</h2>';
  h+=L.length?'<div class="card" style="margin-top:10px">'+L.map(x=>'<div class="li" style="cursor:default"><div><div class="t">'+esc(x.from.name)+' → '+esc(x.to.name)+'</div><div class="d">Bu tutarı öderse hesaplar kapanır</div></div><div class="a">'+money(x.v,'TRY',2)+'<small>'+(canWriteNow()?'<button class="btn sm" style="margin-top:6px" data-act="settle" data-from="'+esc(x.from.id)+'" data-to="'+esc(x.to.id)+'" data-v="'+x.v+'">Ödemeyi kaydet</button>':'')+'</small></div></div>').join('')+'</div>':'<p class="note" style="margin-top:6px">Hesaplar kapalı, kimsenin borcu yok.</p>';

/* ---------- çizim ---------- */
function niceTicks(min,max,n){
  if(max<=min)max=min+1;
  const raw=(max-min)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step;
  const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v/step)*step);
  return {ticks:t,lo:t[0],hi:t[t.length-1]};
}
function xLabels(months,slot){
  const every=Math.max(1,Math.ceil(34/slot));
  return months.map((k,i)=>{
    if(i%every!==0&&i!==months.length-1)return null;
    if(i!==months.length-1&&months.length-1-i<every&&every>1)return null;
    return (k.endsWith('-01')||i===0)?mlabel(k)+" '"+k.slice(2,4):mlabel(k);
  });
}
function drawFlow(host,F){
  const W=Math.max(280,host.clientWidth||600),H=W<520?240:300;
  const m={l:46,r:8,t:10,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const vals=[0];F.forEach(r=>vals.push(r.in,r.out,r.net));
  const T=niceTicks(Math.min.apply(null,vals),Math.max.apply(null,vals),4);
  const y=v=>m.t+ih-(v-T.lo)/(T.hi-T.lo)*ih;
  const n=F.length,slot=iw/n;
  const bw=Math.max(3,Math.min(24,Math.floor((slot*0.64-2)/2)));
  const bar=(x,w,v,cls)=>{const y0=y(0),y1=y(v),h=y0-y1;if(h<0.5)return '';const r=Math.min(4,h,w/2);return '<path class="'+cls+'" d="M'+x+','+y0+'V'+(y1+r)+'Q'+x+','+y1+' '+(x+r)+','+y1+'H'+(x+w-r)+'Q'+(x+w)+','+y1+' '+(x+w)+','+(y1+r)+'V'+y0+'Z"/>'};
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Aylık gelir, gider ve net nakit akışı grafiği">';
  T.ticks.forEach(t=>{const yy=y(t);s+='<line class="'+(t===0?'ax':'gr')+'" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(m.l-8)+'" y="'+(yy+4)+'" text-anchor="end">'+compact(t)+'</text>'});
  if(T.lo<0&&!T.ticks.includes(0)){const yy=y(0);s+='<line class="ax" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'"/>'}
  const pts=F.map((r,i)=>[m.l+slot*(i+.5),y(r.net)]);
  if(n>1)s+='<path d="M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const lbl=xLabels(F.map(r=>r.k),slot);
  F.forEach((r,i)=>{
    const cx=m.l+slot*(i+.5);
    s+='<g class="g" tabindex="0" data-i="'+i+'" role="img" aria-label="'+esc(mfull(r.k)+': gelir '+money(r.in,S.ccy,0)+', gider '+money(r.out,S.ccy,0)+', net '+signed(r.net,S.ccy,0))+'"><rect class="band" x="'+(m.l+slot*i)+'" y="'+m.t+'" width="'+slot+'" height="'+ih+'"/>'
      +bar(cx-bw-1,bw,r.in,'m-in')+bar(cx+1,bw,r.out,'m-out')
      +(slot>=16||i===n-1?'<circle cx="'+cx+'" cy="'+pts[i][1]+'" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>':'')+'</g>';
    if(lbl[i])s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(lbl[i])+'</text>';
  });
  host.innerHTML=s+'</svg>';
}
function drawBal(host,Bs){

  const m={l:46,r:12,t:22,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;

    s+='<path d="M'+d+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

      +(slot>=24||i===n-1?'<circle cx="'+cx+'" cy="'+pts[i][1]+'" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>':'')+'</g>';
    if(lbl[i])s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(lbl[i])+'</text>';

  const last=pts[n-1],prev=n>1?pts[n-2]:null,txt=money(Bs[n-1].v,S.ccy,0);

  host.innerHTML=s+'</svg>';
}

const tip=$('#tip');
function showTip(html,x,y){
  tip.innerHTML=html;tip.classList.add('on');
  const r=tip.getBoundingClientRect();let tx=x+14,ty=y+14;
  if(tx+r.width>innerWidth-8)tx=x-r.width-14;
  if(ty+r.height>innerHeight-8)ty=y-r.height-14;
  tip.style.left=Math.max(8,tx)+'px';tip.style.top=Math.max(8,ty)+'px';
}
const hideTip=()=>tip.classList.remove('on');
const trow=(color,val,label)=>'<div class="r"><span class="k" style="background:'+color+'"></span><b>'+esc(val)+'</b><span class="l">'+esc(label)+'</span></div>';
function tipFor(el){
  if(!S.m)return '';
  const host=el.closest('#c-flow,#c-bal,#c-cat');if(!host)return '';
  const i=+el.getAttribute('data-i');
  if(host.id==='c-flow'){const r=S.m.F[i];return r?'<div class="t">'+esc(mfull(r.k))+'</div>'+trow('var(--gelir)',money(r.in,S.ccy,0),'gelir')+trow('var(--gider)',money(r.out,S.ccy,0),'gider')+trow('var(--ink)',signed(r.net,S.ccy,0)||money(0,S.ccy,0),'net'):''}
  if(host.id==='c-bal'){const r=S.m.Bs[i];return r?'<div class="t">'+esc(mfull(r.k)+(r.k===mkey(todayStr())?' · bugün':' sonu'))+'</div>'+trow('var(--ink)',money(r.v,S.ccy,0),'kasa'):''}
  const r=S.m.cat[i];return r?'<div class="t">'+esc(r.name)+'</div>'+trow(S.catView==='income'?'var(--gelir)':'var(--gider)',money(r.v,S.ccy,0),'%'+Math.round(r.pct*100)+' pay'):'';
}
document.addEventListener('pointermove',e=>{
  const el=e.target.closest&&e.target.closest('#c-flow [data-i],#c-bal [data-i],#c-cat [data-i]');
  if(!el){hideTip();return}
  const h=tipFor(el);if(h)showTip(h,e.clientX,e.clientY);else hideTip();
});
document.addEventListener('pointerleave',hideTip);
document.addEventListener('focusin',e=>{
  const el=e.target.closest&&e.target.closest('#c-flow [data-i],#c-bal [data-i],#c-cat [data-i]');
  if(!el){hideTip();return}
  const r=el.getBoundingClientRect(),h=tipFor(el);if(h)showTip(h,r.left+r.width/2,r.top+Math.min(r.height,40)/2);
});
document.addEventListener('focusout',hideTip);

/* ---------- render ---------- */
let rafId=0;
function schedule(){if(rafId)return;rafId=requestAnimationFrame(()=>{rafId=0;render()})}
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>'<button class="tab" role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>').join('')}
function renderWho(){
  const r=S.demo?'Örnek mod':S.dbState!=='ok'?'Bağlı değil':S.canAdmin?'Yönetici':S.canWrite?'Veri girebilir':'Salt okunur';
  $('#who').textContent=(S.meName?S.meName+' · ':'')+r;
}
function render(){
  const app=$('#app'),f=document.activeElement,fid=f&&f.id&&app.contains(f)?f.id:null;
  const sel=fid&&f.selectionStart!=null?[f.selectionStart,f.selectionEnd]:null;
  renderWho();
  if(!S.ready){app.innerHTML='<div class="loading">Veriler yükleniyor…</div>';return}
  const fn={ozet:vOzet,islemler:vTx,ortaklar:vOrtaklar,kdv:vKdv,ayarlar:vSet}[S.tab]||vOzet;
  app.innerHTML=fn();
  chartW=app.clientWidth;
  drawCharts();
  if(fid){const e=document.getElementById(fid);if(e){e.focus();if(sel&&e.setSelectionRange)try{e.setSelectionRange(sel[0],sel[1])}catch(x){}}}
}
function setTab(v){
  S.tab=v;try{history.replaceState(null,'','#'+v)}catch(e){}
  renderTabs();render();window.scrollTo(0,0);
}
if(window.ResizeObserver)new ResizeObserver(()=>{const w=$('#app').clientWidth;if(w&&w!==chartW){chartW=w;drawCharts()}}).observe($('#app'));
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}

/* ---------- modal ---------- */
let lastFocus=null;
function openModal(html){
  lastFocus=document.activeElement;
  const m=$('#modal');m.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;
  const first=m.querySelector('input:not([type=hidden]),select,textarea');if(first&&innerWidth>720)first.focus();
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act="edit-tx"]')&&e.target.tagName!=='BUTTON'){e.preventDefault();openTxForm(S.tx.find(t=>t.id===e.target.dataset.id))}});
const errMsg=e=>{const c=e&&e.code;
  return c==='conflict'?'Bu kayıt az önce başkası tarafından değiştirildi. Liste yenilendi, tekrar dene.'
    :c==='forbidden'?'Bu işlem için yetkin yok.'
    :c==='auth'?'Oturumun süresi doldu, sayfayı yenile.'
    :c==='notfound'?'Kayıt bu arada silinmiş.'
    :c==='network'?'Sunucuya ulaşılamadı.'
    :(e&&e.message)||'Kaydedilemedi, tekrar dene.'};
const canWriteNow=()=>!S.demo&&S.dbState==='ok'&&S.canWrite;
async function afterWriteError(e,col){if(e&&(e.code==='conflict'||e.code==='notfound')){try{await reload(col)}catch(x){}}}

/* işlem formu */
function openTxForm(t,preset){
  const isNew=!t;
  if(!S.accounts.length){toast('Önce Ayarlar sekmesinden bir hesap ekle');return}
  if(!S.cats.length&&(!t||t.type!=='transfer')&&!(preset&&preset.type==='transfer')){toast('Önce Ayarlar sekmesinden kategori ekle');return}
  const d=t||Object.assign({type:'expense',date:todayStr(),status:'done',currency:S.accounts[0].currency,accountId:S.accounts[0].id,amount:'',vatRate:null,note:'',ref:'',cashDate:''},preset||{});
  let type=d.type,vatTouched=!isNew,rateTouched=!isNew,toTouched=!isNew||!!(preset&&preset.toAmount);
  const accOpts=(sel)=>S.accounts.map(a=>'<option value="'+esc(a.id)+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+' ('+a.currency+')</option>').join('');
  const can=canWriteNow();
  openModal('<h2>'+(isNew?'Yeni işlem':'İşlemi düzenle')+'</h2><p class="preview" id="f-meta"></p>'
   +'<form id="txf" novalidate><div class="fgrid">'
   +'<div class="field full"><div class="seg" role="group" aria-label="Tür" id="f-type"><button type="button" data-t="expense">Gider</button><button type="button" data-t="income">Gelir</button><button type="button" data-t="transfer">Hesaplar arası aktarım</button></div></div>'
   +'<div class="field"><label for="f-date">Tarih</label><input id="f-date" type="date" value="'+esc(d.date)+'" required></div>'
   +'<div class="field" id="w-cat"><label for="f-cat">Kategori</label><select id="f-cat"></select></div>'
   +'<div class="field" id="w-to" hidden><label for="f-to">Hedef hesap</label><select id="f-to">'+accOpts(d.toAccountId||(S.accounts[1]||S.accounts[0]).id)+'</select></div>'
   +'<div class="field"><label for="f-amount" id="l-amount">Tutar (KDV dahil)</label><input id="f-amount" inputmode="decimal" placeholder="0,00" value="'+esc(d.amount===''?'':String(d.amount).replace('.',','))+'" required></div>'
   +'<div class="field"><label for="f-ccy">Para birimi</label><select id="f-ccy"><option value="TRY"'+(d.currency==='TRY'?' selected':'')+'>TRY ₺</option><option value="USD"'+(d.currency==='USD'?' selected':'')+'>USD $</option></select></div>'
   +'<div class="field"><label for="f-fx">Kur (1 USD = ? TRY)</label><input id="f-fx" inputmode="decimal" value="'+esc(d.fxRate?String(d.fxRate).replace('.',','):'')+'"><small id="f-fxh"></small></div>'
   +'<div class="field" id="w-vat"><label for="f-vat">KDV oranı</label><select id="f-vat"></select></div>'
   +'<div class="field" id="w-toamt" hidden><label for="f-toamt">Hedef hesaba geçen tutar</label><input id="f-toamt" inputmode="decimal" value="'+esc(d.toAmount?String(d.toAmount).replace('.',','):'')+'"><small id="f-toh"></small></div>'
   +'<div class="field"><label for="f-acct" id="l-acct">Hesap</label><select id="f-acct">'+accOpts(d.accountId)+'</select></div>'
   +'<div class="field"><label for="f-status">Durum</label><select id="f-status"><option value="done"'+(d.status==='done'?' selected':'')+'>Gerçekleşti</option><option value="planned"'+(d.status==='planned'?' selected':'')+'>Planlı</option></select></div>'
   +'<div class="field"><label for="f-cash">Nakit tarihi <small>(farklıysa)</small></label><input id="f-cash" type="date" value="'+esc(d.cashDate||'')+'"></div>'
   +'<div class="field"><label for="f-ref">Fatura / belge no</label><input id="f-ref" value="'+esc(d.ref||'')+'"></div>'
   +'<div class="field full"><label for="f-note">Not</label><textarea id="f-note">'+esc(d.note||'')+'</textarea></div>'
   +'<div class="full preview" id="f-prev"></div></div><div class="err" id="f-err" role="alert"></div>'
   +(can?'':'<p class="err">'+(S.demo?'Örnek modda kayıt yapılamaz.':'Kayıt yetkin yok.')+'</p>')
   +'<div class="mfoot">'+(!isNew&&can?'<button type="button" class="btn danger sp" id="f-del">Sil</button>':'')+'<button type="button" class="btn" id="f-cancel">Vazgeç</button><button type="submit" class="btn pri" id="f-save"'+(can?'':' disabled')+'>Kaydet</button></div></form>');
  const g=id=>document.getElementById(id);
  if(!isNew&&(d.createdBy||d.createdAt)){
    g('f-meta').textContent=(d.createdBy?'Ekleyen: '+d.createdBy:'Eklenme')+(d.createdAt?' · '+dfmt(d.createdAt.slice(0,10)):'');
  }
  function fillCats(){
    const sel=g('f-cat');const cur=sel.value||d.categoryId;
    sel.innerHTML=S.cats.filter(c=>c.type===type).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');
    if(Array.from(sel.options).some(o=>o.value===cur))sel.value=cur;
  }
  function fillVat(v){
    const sel=g('f-vat');const opts=VAT_OPTS.slice();if(v!=null&&!opts.includes(+v))opts.push(+v);opts.sort((a,b)=>a-b);
    sel.innerHTML=opts.map(o=>'<option value="'+o+'">%'+o+'</option>').join('');sel.value=String(v==null?0:+v);
  }
  function applyType(){
    g('f-type').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===type)));
    const tr=type==='transfer';
    g('w-cat').hidden=tr;g('w-vat').hidden=tr;g('w-to').hidden=!tr;g('w-toamt').hidden=!tr;
    g('l-acct').textContent=tr?'Kaynak hesap':'Hesap';
    g('l-amount').textContent=tr?'Çıkan tutar':'Tutar (KDV dahil)';
    if(!tr){fillCats();if(!vatTouched){const c=S.catMap.get(g('f-cat').value);fillVat(c?c.vatDefault:0)}}
    if(tr){const a=S.acctMap.get(g('f-acct').value);if(a)g('f-ccy').value=a.currency;g('f-ccy').disabled=true}else g('f-ccy').disabled=false;
    syncRate();
  }
  function syncRate(){
    const r=rateAt(g('f-date').value);
    if(!rateTouched){g('f-fx').value=r?String(r.v).replace('.',','):''}
    g('f-fxh').textContent=r?((S.basis==='sell'?'Satış':'Alış')+' kuru · '+dfmt(r.date)+(r.exact?'':' (en yakın kayıt)')):'Bu tarih için kayıtlı kur yok, elle gir.';
    syncTo();preview();
  }
  function syncTo(){
    if(type!=='transfer')return;
    const a=S.acctMap.get(g('f-acct').value),b=S.acctMap.get(g('f-to').value);if(!a||!b)return;
    const amount=num(g('f-amount').value),fx=num(g('f-fx').value);
    if(!toTouched){
      if(a.currency===b.currency)g('f-toamt').value=isFinite(amount)?String(amount).replace('.',','):'';
      else if(isFinite(amount)&&isFinite(fx)&&fx>0)g('f-toamt').value=String(r2(a.currency==='USD'?amount*fx:amount/fx)).replace('.',',');
    }
    g('f-toh').textContent=b.currency+' cinsinden';
  }
  function preview(){
    const amount=num(g('f-amount').value),fx=num(g('f-fx').value),c=g('f-ccy').value;
    if(!isFinite(amount)||!isFinite(fx)||fx<=0){g('f-prev').textContent='';return}
    g('f-prev').textContent=c==='TRY'?('≈ '+money(amount/fx,'USD',2)+' (işlem günü kuruyla)'):('≈ '+money(amount*fx,'TRY',2)+' (işlem günü kuruyla)');
  }
  g('f-type').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b)return;type=b.dataset.t;applyType()});
  g('f-cat').addEventListener('change',()=>{vatTouched=false;const c=S.catMap.get(g('f-cat').value);fillVat(c?c.vatDefault:0)});
  g('f-vat').addEventListener('change',()=>{vatTouched=true});
  g('f-date').addEventListener('change',syncRate);
  g('f-ccy').addEventListener('change',preview);
  g('f-fx').addEventListener('input',()=>{rateTouched=true;syncTo();preview()});
  g('f-amount').addEventListener('input',()=>{syncTo();preview()});
  g('f-acct').addEventListener('change',()=>{if(type==='transfer'){const a=S.acctMap.get(g('f-acct').value);if(a)g('f-ccy').value=a.currency}syncTo();preview()});
  g('f-to').addEventListener('change',()=>{toTouched=false;syncTo()});
  g('f-toamt').addEventListener('input',()=>{toTouched=true});
  g('f-cancel').addEventListener('click',closeModal);
  fillCats();fillVat(isNew?null:d.vatRate);applyType();
  if(!isNew&&type!=='transfer'){g('f-cat').value=d.categoryId||g('f-cat').value;}
  if(isNew&&type!=='transfer'){const c=S.catMap.get(g('f-cat').value);fillVat(c?c.vatDefault:0)}
  if(!isNew&&type==='transfer'){g('f-ccy').value=d.currency}
  preview();
  if(!isNew&&can){
    let armed=false;const del=g('f-del');
    del.addEventListener('click',async()=>{
      if(!armed){armed=true;del.textContent='Silmek için tekrar tıkla';return}
      del.disabled=true;
      try{await api.del('transactions',t.id);await reload('transactions');closeModal();toast('İşlem silindi')}catch(e){g('f-err').textContent=errMsg(e);del.disabled=false}
    });
  }
  g('txf').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const err=g('f-err');err.textContent='';
    if(!canWriteNow())return;
    const date=g('f-date').value,amount=num(g('f-amount').value),fx=num(g('f-fx').value),cur=g('f-ccy').value,acct=g('f-acct').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent='Tarih seç.';return}
    if(!isFinite(amount)||amount<=0){err.textContent='Tutarı sıfırdan büyük gir.';return}
    if(!isFinite(fx)||fx<=0){err.textContent='Kur gerekli: USD karşılığını hesaplamak için kuru elle gir.';return}
    if(!S.acctMap.has(acct)){err.textContent='Hesap seç.';return}
    const doc={type:type,date:date,amount:r2(amount),currency:cur,fxRate:fx,
      amountTRY:cur==='TRY'?r2(amount):r2(amount*fx),amountUSD:cur==='USD'?r2(amount):r2(amount/fx),
      accountId:acct,status:g('f-status').value,cashDate:g('f-cash').value||'',note:g('f-note').value.trim(),ref:g('f-ref').value.trim(),
      categoryId:'',vatRate:0,toAccountId:'',toAmount:0,
      createdBy:isNew?(S.uid||''):(d.createdBy||''),createdAt:isNew?new Date().toISOString():(d.createdAt||''),updatedBy:S.uid||'',updatedAt:new Date().toISOString()};
    if(type==='transfer'){
      const to=g('f-to').value,ta=num(g('f-toamt').value);
      if(to===acct){err.textContent='Kaynak ve hedef hesap farklı olmalı.';return}
      if(!isFinite(ta)||ta<=0){err.textContent='Hedef hesaba geçen tutarı gir.';return}
      doc.toAccountId=to;doc.toAmount=r2(ta);
    }else{
      doc.categoryId=g('f-cat').value;doc.vatRate=+g('f-vat').value||0;
      if(!doc.categoryId){err.textContent='Kategori seç.';return}
    }
    const btn=g('f-save');btn.disabled=true;
    try{
      if(isNew)await api.add('transactions',doc);else await api.set('transactions',t.id,doc,t._v);
      await reload('transactions');
      closeModal();toast(isNew?'İşlem eklendi':'Değişiklik kaydedildi');
    }catch(e){err.textContent=errMsg(e);btn.disabled=false;afterWriteError(e,'transactions')}
  });
}

    ev.preventDefault();if(!canWriteNow()){g('c-err').textContent=S.demo?'Örnek modda kayıt yapılamaz.':'Yetkin yok.';return}
    const name=g('c-name').value.trim();if(!name){g('c-err').textContent='Kategori adı gir.';return}
    const doc={name:name,type:g('c-type').value,vatDefault:+g('c-vat').value,order:isNew?S.cats.length+1:(c.order||0)};
    try{if(isNew)await api.add('categories',doc);else await api.set('categories',c.id,doc,c._v);await reload('categories');closeModal();toast('Kategori kaydedildi')}catch(e){g('c-err').textContent=errMsg(e);afterWriteError(e,'categories')}
  });
}
async function seedDefaults(){
  if(!canWriteNow())return;
  try{
    for(let i=0;i<DEFAULT_CATS.length;i++){const c=DEFAULT_CATS[i];await api.set('categories',c[0],{name:c[1],type:c[2],vatDefault:c[3],order:i+1})}
    await reload('categories');toast('Varsayılan kategoriler yüklendi');
  }catch(e){toast(errMsg(e))}
}
async function setBasis(v){
  if(!canWriteNow()||!S.canAdmin)return;
  try{await api.set('settings','main',Object.assign({},S.settings,{rateBasis:v}),S.settingsV);await reload('settings');toast(v==='sell'?'Satış kuru seçildi':'Alış kuru seçildi')}
  catch(e){toast(errMsg(e));afterWriteError(e,'settings')}
}
async function refreshRatesNow(btn){
  if(!canWriteNow()||!S.canAdmin)return;
  if(btn)btn.disabled=true;
  try{const r=await api.refreshRates();if(r.ok){await reload('rates');toast((r.changed?'Kur güncellendi: ':'Kur zaten güncel: ')+dfmt(r.date)+' · alış '+NF2.format(r.buy))}else toast('Kur alınamadı: '+(r.error||''))}
  catch(e){toast(errMsg(e))}
  if(btn)btn.disabled=false;
}

/* JSON içe aktarma (yönetici) */
function openImport(){
  openModal('<h2>JSON içe aktar</h2><p class="note">{"docs":[{"collection":…,"id":…,"data":{…}}]} biçiminde bir dosya. Aynı kimlikli kayıtların üstüne yazar, diğerlerine dokunmaz.</p>'
   +'<form id="if" novalidate><div class="field" style="margin-top:12px"><label for="i-file">Dosya</label><input id="i-file" type="file" accept="application/json,.json"></div><div class="preview" id="i-prev" style="margin-top:8px"></div><div class="err" id="i-err" role="alert"></div>'
   +'<div class="mfoot"><button type="button" class="btn" id="i-cancel">Vazgeç</button><button type="submit" class="btn pri" id="i-go" disabled>İçe aktar</button></div></form>');
  const g=id=>document.getElementById(id);let docs=null;
  g('i-cancel').addEventListener('click',closeModal);
  g('i-file').addEventListener('change',()=>{
    docs=null;g('i-go').disabled=true;g('i-err').textContent='';g('i-prev').textContent='';
    const f=g('i-file').files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        let j=JSON.parse(String(rd.result));const arr=Array.isArray(j)?j:(j&&Array.isArray(j.docs)?j.docs:null);
        if(!arr)throw new Error('Dosyada "docs" dizisi yok.');
        const counts={};
        arr.forEach((d,i)=>{if(!d||COLLECTIONS.indexOf(d.collection)<0||typeof d.id!=='string'||!d.data||typeof d.data!=='object'||Array.isArray(d.data))throw new Error('Geçersiz kayıt: #'+(i+1));counts[d.collection]=(counts[d.collection]||0)+1});
        docs=arr;g('i-prev').textContent=arr.length+' kayıt: '+Object.keys(counts).map(k=>k+' '+counts[k]).join(', ');g('i-go').disabled=false;
      }catch(e){g('i-err').textContent=e.message||'Dosya okunamadı.'}
    };
    rd.readAsText(f);
  });
  g('if').addEventListener('submit',async ev=>{
    ev.preventDefault();if(!docs||!canWriteNow()||!S.canAdmin)return;
    const btn=g('i-go');btn.disabled=true;g('i-err').textContent='';
    try{
      for(let i=0;i<docs.length;i+=200)await api.importDocs(docs.slice(i,i+200));
      await reloadAll(false);closeModal();toast(docs.length+' kayıt içe aktarıldı');
    }catch(e){g('i-err').textContent=errMsg(e);btn.disabled=false}
  });
}

/* csv */
function saveFile(name,text,type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function exportCsv(){
  const head=['tarih','tur','kategori','tutar','para_birimi','kur','tutar_try','tutar_usd','kdv_orani','hesap','hedef_hesap','hedef_tutar','durum','nakit_tarihi','not','belge_no','ekleyen'];
  const q=v=>{v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const n=v=>String(v==null?'':v).replace('.',',');
  const L=S.tx.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).map(t=>[t.date,t.type==='income'?'gelir':t.type==='expense'?'gider':'aktarim',(S.catMap.get(t.categoryId)||{}).name||'',n(t.amount),t.currency,n(t.fxRate),n(t.amountTRY),n(t.amountUSD),t.vatRate||0,(S.acctMap.get(t.accountId)||{}).name||'',(S.acctMap.get(t.toAccountId)||{}).name||'',n(t.toAmount||''),t.status==='done'?'gerceklesti':'planli',t.cashDate||'',t.note||'',t.ref||'',t.createdBy||''].map(q).join(';'));
  saveFile('deltax-nakit-akisi-'+todayStr()+'.csv','﻿'+[head.join(';')].concat(L).join('\r\n'),'text/csv;charset=utf-8');
  toast('CSV indiriliyor');
}

/* örnek veri (yalnızca bellekte) */
function enterDemo(){
  S.demo=true;S.ready=true;
  let seed=11;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
  const today=todayStr(),cur=mkey(today),start=addM(cur,-11);
  S.accounts=[{id:'a1',name:'TRY vadesiz',currency:'TRY',opening:6000000,openingDate:start+'-01',order:1},{id:'a2',name:'USD hesabı',currency:'USD',opening:15000,openingDate:start+'-01',order:2},{id:'a3',name:'Ayşe (cepten)',currency:'TRY',opening:0,openingDate:'',partner:true,share:1,order:3},{id:'a4',name:'Mert (cepten)',currency:'TRY',opening:0,openingDate:'',partner:true,share:1,order:4},{id:'a5',name:'Deniz (cepten)',currency:'TRY',opening:0,openingDate:'',partner:true,share:1,order:5}];
  S.cats=DEFAULT_CATS.map((c,i)=>({id:c[0],name:c[1],type:c[2],vatDefault:c[3],order:i+1}));
  S.settings={};
  const docs={};let i=0;
  for(let d=addDays(start+'-01',0);d<=addDays(today,45);d=addDays(d,1),i++){const k=mkey(d);docs[k]=docs[k]||{id:k};const v=41.8+i*(7.9/370);docs[k][d]=[+v.toFixed(4),+(v+0.09).toFixed(4)]}
  S.ratesDocs=Object.values(docs);derive();
  const tx=[];
  const mk=(date,type,cat,amount,ccy,o)=>{
    o=o||{};const r=rateAt(date),fx=r?r.v:48;const c=S.catMap.get(cat);
    tx.push(norm({id:'d'+tx.length,type:type,date:date,categoryId:cat,amount:r2(amount),currency:ccy,fxRate:fx,amountTRY:ccy==='TRY'?r2(amount):r2(amount*fx),amountUSD:ccy==='USD'?r2(amount):r2(amount/fx),vatRate:o.vat!=null?o.vat:(c?c.vatDefault:0),accountId:o.acct||'a1',status:date>today?'planned':'done',cashDate:o.cash||'',note:o.note||'',ref:'',createdAt:date+'T10:00:00Z'}));
  };
  const ms=monthsBetween(start,cur);
  const steam=[0,0,0,0,0,0,48000,26000,14000,9000,7000,6000];
  ms.forEach((k,mi)=>{
    mk(k+'-03','expense','c-ofis',46000+mi*600,'TRY',{note:'Ofis kirası'});
    mk(k+'-05','expense','c-yazilim',620+r2(rnd()*120),'USD',{note:'Motor, bulut ve tasarım abonelikleri'});
    mk(k+'-12','expense','c-freelance',Math.round(40000+rnd()*50000),'TRY',{note:'Ses ve çizim'});
    mk(k+'-18','expense','c-pazarlama',Math.round((mi>=5&&mi<=7?170000:25000)+rnd()*30000),'TRY',{note:mi>=5&&mi<=7?'Lansman kampanyası':'Sosyal medya'});
    if(mi===ms.length-1)mk(addDays(today,6),'expense','c-muhasebe',18000,'TRY',{note:'Aylık muhasebe ücreti'});
    mk(k+'-26','expense','c-vergi',Math.round(88000+rnd()*14000),'TRY',{note:'SGK ve stopaj'});
    mk(k+'-28','expense','c-maas',5*112000,'TRY',{note:'5 kişilik ekip'});
    if(steam[mi])mk(k+'-14','income','c-steam',steam[mi]*(0.9+rnd()*0.2),'USD',{note:'Steam aylık ödeme'});
    if(mi===2)mk(k+'-20','income','c-hibe',300000,'TRY',{note:'Destek programı'});
    if(mi===1)mk(k+'-09','expense','c-ekipman',185000,'TRY',{note:'İki geliştirme bilgisayarı'});
    if(mi>=6)mk(k+'-09','expense','c-yazilim',[1800,2600,900][mi%3]*(1+mi%2),'TRY',{acct:['a3','a4','a5'][mi%3],note:'Ortak harcama'});
    if(mi===8)mk(k+'-16','expense','c-seyahat',92000,'TRY',{note:'Fuar'});
  });
  S.tx=tx;
  render();
}
function exitDemo(){location.reload()}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='tab')setTab(v);
  else if(a==='range'){S.range=v;savePrefs();render()}
  else if(a==='ccy'){S.ccy=v;savePrefs();render()}
  else if(a==='catview'){S.catView=v;render()}
  else if(a==='tbl'){S.tbl[v]=!S.tbl[v];render()}
  else if(a==='new-tx')openTxForm(null);
  else if(a==='edit-tx'){const t=S.tx.find(x=>x.id===b.dataset.id);if(t)openTxForm(t)}
  else if(a==='more-tx'){S.txLimit+=100;$('#txList').innerHTML=txListHTML()}
  else if(a==='new-acct')openAcctForm(null);
  else if(a==='edit-acct')openAcctForm(S.acctMap.get(b.dataset.id));
  else if(a==='new-cat')openCatForm(null);
  else if(a==='edit-cat')openCatForm(S.catMap.get(b.dataset.id));
  else if(a==='seed')seedDefaults();
  else if(a==='settle'){if(canWriteNow())openTxForm(null,{type:'transfer',accountId:b.dataset.from,toAccountId:b.dataset.to,amount:+v,toAmount:+v,note:'Ortaklar arası ödeşme'});else toast('Kayıt yetkin yok')}
  else if(a==='export')exportCsv();
  else if(a==='import')openImport();
  else if(a==='rates-refresh')refreshRatesNow(b);
  else if(a==='demo')enterDemo();
  else if(a==='demo-off')exitDemo();
  else if(a==='reload')location.reload();
  else if(a==='basis')setBasis(v);
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  S.f[f]=e.target.value;S.txLimit=100;$('#txList').innerHTML=txListHTML();
});

/* ---------- açılış ---------- */
async function boot(){
  loadPrefs();
  const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;
  renderTabs();render();
  try{
    const me=await api.me();
    S.uid=me.email||'';S.meName=me.email||'';S.canAdmin=me.role==='admin';S.canWrite=true;
  }catch(e){
    S.dbState=(e.code==='auth'||e.code==='forbidden')?'auth':'none';S.ready=true;render();return;
  }
  await reloadAll(false);
  setInterval(syncIfStale,60000);
  window.addEventListener('focus',syncIfStale);
  document.addEventListener('visibilitychange',syncIfStale);
}
boot();
})();
